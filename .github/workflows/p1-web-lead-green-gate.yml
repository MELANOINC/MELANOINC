name: P1 Web Lead Green Gate

on:
  push:
    branches: [main]
    paths:
      - index.html
      - api/contact.js
      - .github/workflows/p1-web-lead-green-gate.yml

jobs:
  controlled-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit controlled lead after production is ready
        shell: bash
        run: |
          set -euo pipefail
          url="https://melano-inc-three.vercel.app/api/contact"
          payload='{"name":"GREEN GATE MELANO INC 2026-08-26","email":"green-gate-melanoinc-20260826@example.com","company":"MELANO INC QA","message":"Lead controlado P1 melanoinc.online -> LUXIA","source_path":"/?utm_source=qa&utm_medium=green-gate&utm_campaign=melanoinc-luxia-p1","referrer":"https://melanoinc.online","utm_source":"qa","utm_medium":"green-gate","utm_campaign":"melanoinc-luxia-p1","utm_content":"controlled-test","utm_term":"p1"}'
          for attempt in $(seq 1 30); do
            code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
              --request POST "$url" \
              --header 'Content-Type: application/json' \
              --header 'X-Idempotency-Key: p1-melanoinc-20260826' \
              --data "$payload" || true)
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              cat response.json
              exit 0
            fi
            echo "attempt=$attempt status=$code"
            sleep 5
          done
          cat response.json || true
          exit 1
